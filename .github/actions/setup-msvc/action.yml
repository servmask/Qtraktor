name: Setup MSVC
description: >
  Puts the MSVC toolchain on PATH by running vcvarsall.bat and exporting the
  resulting environment delta to GITHUB_ENV. Replaces ilammy/msvc-dev-cmd, which
  has no Node 24 release and stops working once GitHub removes the Node 20 runtime.

inputs:
  arch:
    description: Architecture argument passed to vcvarsall.bat (x64, x86, arm64, ...)
    required: false
    default: x64

runs:
  using: composite
  steps:
    - name: Run vcvarsall and export the environment delta
      shell: pwsh
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        $ErrorActionPreference = 'Stop'

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

        # Prefer an install that actually carries the C++ toolset; fall back to
        # -latest so a runner image that labels components differently still works.
        $installPath = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        if (-not $installPath) {
          $installPath = & $vswhere -latest -products * -property installationPath
        }
        if (-not $installPath) { throw "No Visual Studio installation found" }

        $vcvarsall = Join-Path $installPath 'VC\Auxiliary\Build\vcvarsall.bat'
        if (-not (Test-Path $vcvarsall)) { throw "vcvarsall.bat not found at $vcvarsall" }

        # Snapshot the environment, run vcvarsall, then export only what changed.
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }

        $output = cmd /c "`"$vcvarsall`" $env:ARCH >nul 2>&1 && set"
        if ($LASTEXITCODE -ne 0 -or -not $output) {
          throw "vcvarsall.bat $env:ARCH failed (exit code $LASTEXITCODE)"
        }

        $exported = 0
        foreach ($line in $output) {
          if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
            $name = $Matches[1]
            $value = $Matches[2]
            if ($before[$name] -eq $value) { continue }
            # GITHUB_ENV is parsed line by line, so a value containing a newline
            # would let one variable spill into the next. vcvarsall does not emit
            # one, but fail loudly rather than corrupt the file if that changes.
            if ($value -match "[`r`n]") { throw "Refusing to export multi-line value for $name" }
            # pwsh writes UTF-8 without a BOM; Windows PowerShell 5.1 would not,
            # and a BOM corrupts the first entry. This step must stay on pwsh.
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $exported++
          }
        }

        # A silent no-op here is the failure mode worth guarding: the build would
        # continue and fail much later with a confusing "cl.exe not found".
        if ($exported -eq 0) { throw "vcvarsall.bat produced no environment changes" }
        Write-Host "Exported $exported environment variables from vcvarsall.bat $env:ARCH"
